changes_in_scope:
  - requirement and requirement-analysis active artifact consolidation
  - developer-spec-contract ownership split and program-spec implementation-delta template
  - single-table 17-item program readiness
  - simplified open-resolution human view
  - setup five-question fast path with legacy preset-id compatibility
  - customer document 8-to-3 active-view consolidation and projection runtime
  - minimal canonical JSON store and delta apply runtime
  - canonical confirmed-business mutation hardening including GIVEN evidence
  - semantic delta-id payload hash and same-id/different-content conflict detection
  - explicit NO_CHANGE canonical result for document-only stage work
  - executable /work coordinator with arbitrary target IDs
  - explicit Stage re-entry and Artifact override independent from Target ID
  - target-graph mutation guard and explicit confirmed-business-change authorization guard
  - low-level Agent Stage Result Envelope and validator
  - provider-driven Greenfield /work E2E runner with no hardcoded time-domain stage outputs
  - deterministic validation fixture provider that cannot claim Agent E2E
  - actual /work repeatability runner against the same Canonical snapshot
  - automatic source manifest and artifact evidence index generation
  - end-to-end source reverse check orchestrator
  - external Agent repeatability experiment runner and disabled-by-default provider profile
  - Java/Spring/MyBatis static Project Impact Adapter pilot
  - real public Spring/MyBatis Brownfield repository integration pilot
  - Source/Impact graph to Program Spec semantic reverse candidate/diff
externally_blocked_validation:
  - actual LLM or Agent provider repeated-generation empirical execution; no provider/API/CLI is connected to this project session
  - actual provider-driven Greenfield semantic E2E; validation fixture only proves executor wiring
  - human usability study with analyst/designer/developer/customer participants; no human panel/session data is available
  - customer proprietary production repository validation; no customer repository was provided, so a pinned real public repository was used instead
not_claimed:
  - validation fixture provider proves Agent or LLM semantic quality
  - full Java AST/type resolution and Spring runtime/proxy analysis
  - JPA/JDBC/stored-procedure/event/external-interface/config/build semantic adapters
  - automatic Functional Design or Business Truth reverse rewrite
  - automatic Program Spec file rewrite from Source
  - LLM theoretical determinism
  - measured human usability improvement
