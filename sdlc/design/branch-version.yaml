    status: PARTIAL_CONTROLLED_PILOT
    implemented:
      - provider/source changes rollback on stage or canonical failure
      - build/test gate before canonical apply for DEVELOPMENT
      - dirty workspace guard blocks subsequent execution until workspace is reconciled
    residual_gap:
