version: 1
status: ACTIVE_P2_CANDIDATE

branch_model:
  change_branch_pattern: change/<requirement-or-change-id>/<slug>
  agent_branch_pattern: agent/<requirement-or-change-id>/<task-id>/<agent-or-role>
  merge_flow:
    - agent_branch_to_change_branch
    - integration_test_on_change_branch
    - semantic_merge_and_regenerate
    - reverse_sync
    - verification

write_guard:
  source_write_requires_revision_match: true
  source_write_requires_agent_branch: true
  source_write_requires_parent_change_branch: true
  requested_path_must_be_owned_or_shared: true
  shared_path_requires_coordination_proof: true
  active_claim_overlap_is_denied: true
  mismatch_auto_overwrite: DENY

evidence:
  required:
    - expected_revision
    - current_revision
    - requested_paths
    - owned_paths_or_shared_paths
  conditional:
    - coordination_proof_ref

runtime:
  guard_script: sdlc/scripts/guard_revision_ownership.py
  context_template: sdlc/templates/change-execution-context.yaml
  guard_result_must_be_passed_to_stage_pack_for_source_write: true
