# 작성 완료 예시입니다. 새 프로젝트에서는 이 파일 자체를 수정하지 말고
# setup이 만든 .sdlc/project.yaml 한 파일만 유지합니다.
# 옵션별 역할/허용값/Runtime 적용 여부: docs/00_시작/02A_PROJECT_CONFIG_옵션_상세가이드.md
# 모르는 값을 예시 값으로 복사하지 말고 unresolved에 남깁니다.
# agent 항목은 생략하면 INTERACTIVE가 기본입니다.
# Change Level은 실행 깊이/Evidence/Review 필요성이며 문서 개수와 다른 개념입니다.
# Engineering과 Customer 문서 topology는 서로 독립적으로 선택합니다.
schema_version: 1
project:
  name: "order-service"
  mode: "BROWNFIELD"
  description: "주문/결제/재고 연계 서비스를 유지보수하는 프로젝트"
delivery:
  profile: "STANDARD"
change:
  # AUTO: Evidence 기반 자동 판정. minimum_level보다 낮아지지 않습니다.
  # MANUAL: default_level 또는 Target별 level을 사람이 정합니다.
  level_policy: "AUTO"
  minimum_level: "L1"
  # 프로젝트 시작 전에 특정 요구사항의 Level을 고정해야 할 때 사용합니다.
  # target_levels:
  #   RQ-001:
  #     level: "L3"
  #     reason: "업무정의서 수준의 기능 영향 검토가 필요한 요구사항"
  # 안전 하한보다 낮게 강제해야 하는 특별한 경우에만 accept_below_safety_floor를 명시합니다.
agent:
  execution: "INTERACTIVE"
technology:
  language: "Java"
  framework: "Spring Boot"
  build:
    - "./mvnw -q -DskipTests package"
  test:
    - "./mvnw test"
source:
  roots:
    - "src/main/java"
  test_roots:
    - "src/test/java"
  resource_roots:
    - "src/main/resources"
  excludes:
    - ".git/**"
    - "target/**"
architecture:
  style: "Layered"
  modules:
    - "order"
    - "payment"
    - "inventory"
git:
  branch_strategy: "feature-branch + pull-request"
  protected_branches:
    - "main"
coding:
  convention: "프로젝트 Java Coding Convention"
  naming: "기존 코드의 package/class/method naming 유지"
data:
  database: "PostgreSQL"
  orm_mapper: "JPA"
  migration: "Flyway"
interface:
  api: "REST"
  event: "Kafka"
  batch: "없음"
security:
  standard: "프로젝트 보안 가이드 v2"
deployment:
  environment: "dev/test/prod"
documents:
  language: "ko-KR"
  engineering:
    profile: "ENGINEERING_SDD_COMPACT"
    manual_edit_policy: "TYPO_ONLY"
    freshness: "CANONICAL_REVISION"
  customer:
    profile: "CUSTOMER_STANDARD_3"
    scope: "RQ"
    freshness: "CANONICAL_AND_AS_BUILT"
    final_review:
      human_editable: true
  pm:
    profile: "PM_STANDARD"
  machine:
    visibility: "HIDDEN"
unresolved:
  - "부분취소 시 재고 복구 순서의 업무정책 확인 필요"
