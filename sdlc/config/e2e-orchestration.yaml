version: 2
status: ACTIVE_P2_CANDIDATE

purpose: >-
  특정 Pilot Requirement Group이나 도메인 명칭을 재해석하지 않고 동일 Work Unit의
  Stage 상태, Blocker, Release Gate를 하나의 /check Read Model로 조합한다.

runtime:
  orchestrator: sdlc/scripts/orchestrate_generic_e2e_status.py
  ledger_template: sdlc/templates/e2e-execution-ledger.yaml
  legacy_orchestrator: sdlc/scripts/orchestrate_e2e_status.py
  legacy_orchestrator_status: COMPATIBILITY_ONLY

principles:
  orchestrator_is_read_model_only: true
  never_create_business_truth: true
  never_promote_candidate_to_canonical: true
  never_promote_fixture_to_production: true
  never_treat_contract_coverage_as_runtime_pass: true
  preserve_open_partial_blocked_failed_state: true
  stage_names_are_not_domain_specific: true

stage_state_priority:
  - FAILED
  - BLOCKED
  - ACTION_REQUIRED
  - PARTIAL
  - READY
  - COMPLETE
  - NOT_STARTED

release_gate:
  require_all_required_for_release_stages_complete: true
  require_no_release_blockers: true
  require_production_verified: true
  require_verification_state: VERIFIED_PASS

blocker_contract:
  required_fields: [code, blocks_release]
  optional_fields: [action, owner, action_scope, evidence_refs]
  action_scoped_blocker_may_allow_other_work: true

user_view:
  max_primary_next_actions: 5
  show_candidate_vs_canonical: true
  show_fixture_vs_production: true
  show_contract_vs_runtime: true
