schema_version: 3
mode: BROWNFIELD
contract: sdlc/design/contracts/brownfield-impact-contract.json
adapter:
  enabled: false
  adapter_id: PROJECT_SPECIFIC_REQUIRED
  implementation_root: sdlc/custom/project/adapters/impact
  # Project 구조와 지원 범위를 확인한 뒤 명시적으로 선택한다. 자동 활성화하지 않는다.
  available_pilots:
    - adapter_id: JAVA_SPRING_MYBATIS_STATIC_PILOT_V0_1
      implementation: sdlc/custom/project/adapters/impact/java_spring_mybatis.py
      status: PILOT_PARTIAL_COVERAGE
      auto_enable: false
      supported:
        - JAVA_DIRECT_FIELD_MEMBER_CALLS
        - SPRING_METHOD_MAPPING_ANNOTATION
        - CONTROLLER_NAMING_ENTRY_CANDIDATE
        - MYBATIS_STATEMENT
        - MYBATIS_SQL_TABLE_READ_WRITE
        - SQL_CREATE_TABLE_ASSET
      not_supported:
        - JAVA_FULL_AST_TYPE_RESOLUTION
        - SPRING_RUNTIME_PROXY_WIRING
        - REFLECTION_DYNAMIC_DISPATCH
        - TRANSACTION_PROPAGATION
        - JPA_JDBC_STORED_PROCEDURE_ETL
        - EXTERNAL_API_CONTRACT
        - KAFKA_JMS_EVENT
        - CONFIG_FEATURE_FLAG_SCHEDULER
        - BUILD_DEPENDENCY_GRAPH
        - TEST_SEMANTIC_COVERAGE
    - adapter_id: JAVA_SPRING_ENTERPRISE_STATIC_V0_2
      implementation: sdlc/custom/project/adapters/impact/java_spring_enterprise.py
      status: PILOT_PARTIAL_COVERAGE
      auto_enable: false
      extends: JAVA_SPRING_MYBATIS_STATIC_PILOT_V0_1
      additionally_supported_as_static_candidates:
        - JPA_ENTITY_TABLE_REPOSITORY
        - JDBC_SQL_LITERAL_TABLE_LINEAGE
        - SPRING_TRANSACTIONAL_ANNOTATION
        - FEIGN_HTTP_CLIENT
        - KAFKA_LISTENER_PUBLICATION_HINT
        - SCHEDULED_AND_APPLICATION_CONFIG
      still_not_supported:
        - JAVA_FULL_AST_TYPE_RESOLUTION
        - SPRING_RUNTIME_PROXY_WIRING
        - REFLECTION_DYNAMIC_DISPATCH
        - TRANSACTION_RUNTIME_PROPAGATION
        - JPA_QUERY_METHOD_RUNTIME_SEMANTICS
        - STORED_PROCEDURE_TRIGGER_ETL
        - LIVE_DB_API_BROKER_TOPOLOGY
        - TEST_SEMANTIC_COVERAGE
project_context:
  language: UNKNOWN
  framework: UNKNOWN
  build_system: UNKNOWN
  persistence: []
  messaging: []
  database: []
  dynamic_features: []
coverage:
  required_dimensions:
    - ENTRY_POINT
    - CALLER
    - CALLEE
    - DATA_READ_WRITE
    - TRANSACTION
    - EXTERNAL_INTERFACE
    - EVENT
    - CONFIG_FEATURE_FLAG
    - TEST
    - MODULE_BUILD_DEPENDENCY
    - DYNAMIC_RUNTIME_GAP
  missing_adapter_status: PARTIAL_PROJECT_ADAPTER_REQUIRED
rules:
  not_found_does_not_mean_no_impact: true
  report_unsupported_patterns: true
  source_relation_does_not_confirm_business_impact: true
  pilot_fixture_pass_does_not_mean_production_complete: true
  project_adapter_is_not_core_required: true
  static_candidate_does_not_equal_runtime_truth: true
