version: 3
registry:
  protocol_version: P0-RUNTIME-CORE-2
  default_timeout_seconds: 30
  no_implicit_fallback: true
  preserve_provider_evidence: true
  providers:
    - provider_id: source-primary
      provider_type: SOURCE
      enabled: true
      provider_state: UNCONFIGURED
      mode: READ_ONLY
      transport: ADAPTER
      capabilities: [source.snapshot.read, source.object.read, source.search, source.diff]
      required_for_modes: [BROWNFIELD, HYBRID]
      optional_for_modes: [GREENFIELD]
      constraints: {bounded_scope_required: true, revision_required: true, write_requires_explicit_capability: true}

    - provider_id: source-write-primary
      provider_type: SOURCE
      enabled: false
      provider_state: DISABLED
      mode: READ_WRITE
      transport: ADAPTER
      capabilities: [source.patch.apply]
      optional_for_stages: [DEVELOPMENT]
      constraints:
        explicit_side_effect_request_required: true
        expected_revision_required: true
        idempotency_key_required: true
        permission_proof_required: true
        ambiguous_target_must_block: true
        unknown_after_write_requires_recovery: true
        default_execution_mode: PROPOSAL_ONLY

    - provider_id: source-analyzer-primary
      provider_type: SOURCE_ANALYZER
      enabled: true
      provider_state: UNCONFIGURED
      mode: READ_ONLY
      transport: ADAPTER
      capabilities: [analysis.source.symbols, analysis.source.dependencies, analysis.source.data_refs, analysis.source.interface_refs]
      optional_for_modes: [BROWNFIELD, HYBRID, AUTO]
      constraints: {stack_specific_logic_must_live_in_adapter: true, unsupported_stack_returns_open: true}

    - provider_id: test-primary
      provider_type: TEST
      enabled: true
      provider_state: UNCONFIGURED
      mode: READ_WRITE
      transport: ADAPTER
      capabilities: [test.discover, test.execute, test.result.read]
      required_for_stages: [TEST, VERIFY]
      constraints: {executable_command_or_native_runner_required: true, execution_evidence_required_for_pass: true}

    - provider_id: canonical-primary
      provider_type: CANONICAL_REGISTRY
      enabled: false
      provider_state: DISABLED
      mode: READ_WRITE
      transport: ADAPTER
      capabilities: [canonical.entity.read, canonical.id.reserve, canonical.publish]
      constraints: {idempotency_key_required_for_write: true, explicit_write_permission_required: true}

    - provider_id: command-router
      provider_type: COMMAND_ROUTER
      enabled: true
      provider_state: AVAILABLE
      mode: READ_ONLY
      transport: LOCAL
      capabilities: [command.route.work, command.route.change, command.route.check, command.route.setup]
      constraints: {router_must_not_invent_provider_result: true, router_must_not_bypass_blocker: true}

capability_policy:
  provider_statuses: [AVAILABLE, DEGRADED, UNAVAILABLE, UNCONFIGURED, DISABLED]
  response_statuses: [OK, PARTIAL, BLOCKED, ERROR]
  write_modes: [READ_ONLY, READ_WRITE]
  missing_required_capability: BLOCKED
  missing_optional_capability: OPEN
  unavailable_provider_behavior: PRESERVE_OPEN
  adapter_specific_fields_location: extensions
  analyzer_implementation_location: sdlc/adapters/analyzers/
  source_write_contract: sdlc/design/contracts/source-write-capability.md
