project:
  name: example-project
  mode: AUTO  # AUTO | BROWNFIELD | GREENFIELD | HYBRID
bootstrap:
  reuse_existing_guides: true
  reuse_source_conventions: true
  reuse_test_conventions: true
  require_manual_confirmation: false
starter_kit:
  mode_specific: true
  greenfield: sdlc/starter-kits/greenfield/starter-manifest.example.yaml
  brownfield: sdlc/starter-kits/brownfield/starter-manifest.example.yaml
preset:
  name: AUTO  # /setup이 project.mode에 맞는 preset을 선택한다.
  mode_mapping:
    GREENFIELD: greenfield-default
    BROWNFIELD: brownfield-auto
    HYBRID: brownfield-auto
    AUTO: AUTO_DISCOVER
source_profile:
  path: sdlc/config/source-profile.yaml
documents:
  language: ko-KR
  terminology_profile: sdlc/config/terminology-profile.json
  internal_view:
    enabled: true
  customer_view:
    enabled: true
    profile: sdlc/config/customer-document-profile.json
    default_mode: both  # internal | customer | both
br_intake:
  profile: sdlc/config/br-intake-profile.json
  preserve_original_files: true
open_resolution:
  profile: sdlc/config/open-resolution-profile.yaml
  sop_required: false
  workbook_template: sdlc/templates/core/open-resolution-workbook.md
  allow_designer_proposal: true
  allow_developer_proposal: true
  allow_existing_system_analysis: true
  allow_source_data_analysis: true
  # 실제 승인권자/위임 규칙은 프로젝트에서 open-resolution-profile.yaml로 조정한다.
customization:
  overlay_order:
    - core
    - preset
    - project_profile
    - project_overlay
    - domain_overlay
    - local_override
  project_overlay: sdlc/custom/project
  domain_overlay_root: sdlc/custom/domain
  domain_overlays: []
workflow:
  process_blocking: false
  execution_guard_enabled: true
pm_tracking:
  assignee_required: false
  schedule_required: false
  effort_required: false
