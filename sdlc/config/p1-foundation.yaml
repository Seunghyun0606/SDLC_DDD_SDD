version: 2
status: ACTIVE_P1_OPERATIONAL_USABILITY

principles:
  start_with_core_defaults: true
  require_upfront_project_customization: false
  customize_only_on_observed_difference: true
  preserve_core_contracts: true
  project_overlay_must_not_copy_core_truth: true
  sample_or_pilot_required: false
  one_primary_authority_per_operational_concept: true
  human_view_and_runtime_artifact_are_separate: true

authority_index: sdlc/config/contract-authority.yaml

project_bootstrap:
  modes: [BROWNFIELD, GREENFIELD, HYBRID, AUTO]
  minimum_before_first_work: [project_identity, project_mode, source_provider_state]
  discovery_is_jit: true
  unobserved_candidates_remain: OPEN
  project_decision_authority: sdlc/config/project-decisions.yaml
  project_decision_registry: .ai-sdlc/project-decisions.yaml

customization:
  strategy: LATE_BOUND_OVERLAY
  policy: sdlc/config/overlay-schema.yaml
  overlay_template: sdlc/templates/project-overlay.yaml
  unknown_target_key: DENY
  create_missing_intermediate_map: DENY
  type_change: DENY
  stale_base_value: DENY
  not_valid_triggers: [JUST_IN_CASE, SAMPLE_SPECIFIC_VALUE, PERSONAL_PREFERENCE_WITHOUT_PROJECT_NEED]
  precedence: [LOCAL_OVERRIDE, DOMAIN_OVERLAY, PROJECT_OVERLAY, PROJECT_PROFILE, PRESET, CORE_DEFAULT]

worklist:
  canonical_is_runtime_authority: true
  canonical_path: .ai-sdlc/worklist-canonical.yaml
  md_view: docs/00_관리/전체작업목록.md
  xlsx_view: docs/00_관리/전체작업목록.xlsx
  stable_id_key: work_item_id
  revision_key: revision
  same_revision_different_value: SYNC_CONFLICT
  silent_overwrite: DENY
  runtime: sdlc/scripts/sync_worklist.py

knowledge:
  registry_path: .ai-sdlc/knowledge-registry.yaml
  promotion_states: [CANDIDATE, REVIEW_REQUIRED, PROMOTED, REJECTED, SUPERSEDED]
  provenance_required: true
  source_behavior_auto_confirms_business_truth: false
  promotion_policy: sdlc/config/knowledge-promotion.yaml
  promotion_runtime: sdlc/scripts/promote_knowledge.py
  automatic_canonical_publish: false

reference_graph:
  node_types: [RQ, FR, BR, PROC, FTR, PGM, ART, SYMBOL, DATA, INT, AC, TC, TASK, CR, KNOWLEDGE, SOURCE]
  relation_type_is_extensible: true
  every_edge_requires_provenance: true
  unresolved_reference_state: OPEN
  silent_reference_drop: DENY

baseline_index:
  duplicate_truth: DENY
  cache_is_derived: true
  cache_can_be_rebuilt: true
  stale_source_revision_marks_cache_stale: true

open_items:
  default_non_blocking: true
  execution_guard_only_for_side_effecting_action: true
  states: [OPEN, ASSUMED, RESOLVED, DEFERRED, GUARDED]
  severity: [INFO, WARNING, CRITICAL]

real_project_entry:
  real_source_required_for_source_claims: true
  actual_test_command_required_for_runtime_test_claims: true
  representative_vertical_slice_before_scale_out: true
  scale_out_requires: [FOUNDATION_STATE_VALID, REFERENCE_GRAPH_VALID, CUSTOMIZATION_CONFLICTS_RECORDED, REPRESENTATIVE_SLICE_REVIEWED]
