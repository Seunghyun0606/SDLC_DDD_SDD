adapter_configs:
  git-worktree-source:
    root: .
    max_files: 2000
    max_bytes: 50000000
    max_output_chars: 50000
    exclude_paths: [.git, .ai-sdlc, node_modules, build, target, dist]
    # Source write 요청 시 extensions.expected_agent_branch를 사용한다.
    # expected_object_sha256를 함께 주면 동일 Commit 위의 미커밋 경쟁 수정도 방어한다.

  allowlisted-subprocess-test:
    cwd: .
    timeout_seconds: 120
    max_timeout_seconds: 900
    max_output_chars: 50000
    allowed_commands:
      # 프로젝트에 맞게 실제 argv를 정확히 등록한다. shell string은 허용하지 않는다.
      - ["./mvnw", "test"]
      - ["./gradlew", "test"]
      - ["npm", "test", "--", "--runInBand"]
