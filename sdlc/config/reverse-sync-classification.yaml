version: 2
status: ACTIVE_STRUCTURAL_REDESIGN_V1

primary_classes:
  - TECHNICAL_ONLY
  - FUNCTIONAL_BEHAVIOR
  - BUSINESS_RULE_CANDIDATE
  - DATA_CONTRACT
  - INTERFACE_CONTRACT
  - SECURITY_BEHAVIOR
  - UNKNOWN

classification_precedence:
  - SECURITY_BEHAVIOR
  - BUSINESS_RULE_CANDIDATE
  - INTERFACE_CONTRACT
  - DATA_CONTRACT
  - FUNCTIONAL_BEHAVIOR
  - TECHNICAL_ONLY
  - UNKNOWN

candidate_signals:
  BUSINESS_RULE_CANDIDATE:
    - added_or_changed_branch_condition
    - added_business_status_constant
    - added_domain_exception_guard
    - policy_named_symbol_added
  DATA_CONTRACT:
    - new_table_reference
    - removed_table_reference
    - mapper_statement_added_or_removed
    - query_semantics_changed
  INTERFACE_CONTRACT:
    - endpoint_contract_changed
    - message_schema_changed
    - external_interface_changed
  SECURITY_BEHAVIOR:
    - authorization_rule_changed
    - authentication_flow_changed
    - sensitive_data_handling_changed
  FUNCTIONAL_BEHAVIOR:
    - arithmetic_or_rounding_change
    - return_or_write_value_change
    - user_observable_exception_change
  TECHNICAL_ONLY:
    - formatting_only
    - comment_only
    - refactor_without_behavior_signal

rules:
  - id: RS-CL-001
    statement: Class는 Source Evidence에 대한 Candidate이며 Business Truth를 자동 변경하지 않는다.
  - id: RS-CL-002
    statement: BUSINESS_RULE_CANDIDATE/SECURITY_BEHAVIOR/UNKNOWN은 Human 또는 L2+ Review가 필요하다.
  - id: RS-CL-003
    statement: STALE 전파는 Confirmed Reference Graph의 직접 관계만 자동 사용한다.
  - id: RS-CL-004
    statement: Requirement/FR/BR/PROC/FTR/AC는 Source 변경만으로 CURRENT Truth를 overwrite하지 않는다.
  - id: RS-CL-005
    statement: 여러 signal이 있으면 primary class와 secondary classes를 모두 기록한다.
  - id: RS-CL-006
    statement: Language/Framework-specific signal extraction은 Analyzer Adapter 책임이며 Core Reverse Sync에 업무/Framework 패턴을 hard-code하지 않는다.

stale_policy:
  technical_types: [PGM, ART, SYMBOL, DATA, INT, TC]
  human_review_types: [RQ, FR, BR, PROC, FTR, AC]
  human_confirmed_truth: PROTECTED
  unconfirmed_graph_edge: DO_NOT_AUTO_PROPAGATE

runtime:
  input_template: sdlc/templates/source-change-evidence.yaml
  generic_engine: sdlc/scripts/build_reverse_sync_from_signals.py
  legacy_fixture_reference: sdlc/scripts/build_reverse_sync_candidate.py
  legacy_fixture_core_status: DEPRECATED_REFERENCE_ONLY
