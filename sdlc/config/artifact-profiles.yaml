version: 2
status: ACTIVE_P0_REDESIGN

resolver:
  default_profile: STANDARD
  allow_project_override: true
  allow_domain_override: true
  expose_internal_artifacts_to_customer: false
  logical_artifact_may_share_physical_document: true

human_document_groups:
  worklist:
    kind: GENERATED_VIEW
    output: docs/00_관리/전체작업목록.md
    satisfies: [worklist]

  customer_functional_spec:
    kind: TEMPLATE
    template: sdlc/starter/onboarding-package-v1/templates/customer-functional-spec.md
    filename_suffix_ko: 기능정의서
    satisfies: [requirement_customer_view, process_analysis]
    audience: [CUSTOMER, BA, PM, DESIGNER]

  engineering_blueprint:
    kind: TEMPLATE
    template: sdlc/starter/onboarding-package-v1/templates/development-blueprint.md
    filename_suffix_ko: 엔지니어링설계
    satisfies: [impact_analysis, engineering_design, program_spec]
    audience: [DESIGNER, DEVELOPER, TESTER]

  implementation_verification:
    kind: TEMPLATE
    template: sdlc/starter/onboarding-package-v1/templates/implementation-verification-result.md
    filename_suffix_ko: 구현검증결과
    satisfies: [implementation_result, test_verification]
    audience: [DEVELOPER, TESTER, PM, CUSTOMER]

  separate_6w:
    kind: TEMPLATE
    template: sdlc/starter/onboarding-package-v1/templates/business-definition-6w.md
    filename_suffix_ko: 6W업무정의
    satisfies: [separate_6w]
    audience: [CUSTOMER, BA]

profiles:
  LITE:
    description: 작은 프로젝트 또는 저위험 변경에서 사람 문서를 최소화하되 Canonical Trace는 유지한다.
    human_artifacts:
      worklist: MUST
      requirement_customer_view: MUST
      engineering_design: MUST
      impact_analysis: CONDITIONAL
      process_analysis: CONDITIONAL
      program_spec: CONDITIONAL_L2_ONLY
      implementation_result: MUST
      test_verification: MUST
      separate_6w: OFF
    internal_capabilities:
      canonical_trace: MUST
      stage_input_pack: MUST
      deterministic_validators: MUST
      source_analysis: CONDITIONAL_BROWNFIELD
      knowledge_promotion: LIGHT
      stale_propagation: DIRECT_RELATION_ONLY
      semantic_merge: OFF
      advanced_telemetry: OFF

  STANDARD:
    description: 일반 고객 프로젝트의 기본 프로필이다.
    human_artifacts:
      worklist: MUST
      requirement_customer_view: MUST
      engineering_design: MUST
      impact_analysis: MUST
      process_analysis: CONDITIONAL
      program_spec: CONDITIONAL_L2_ONLY
      implementation_result: MUST
      test_verification: MUST
      separate_6w: OPTIONAL
    internal_capabilities:
      canonical_trace: MUST
      stage_input_pack: MUST
      deterministic_validators: MUST
      source_analysis: CONDITIONAL_BROWNFIELD
      knowledge_promotion: MUST
      stale_propagation: MUST
      semantic_merge: OPTIONAL
      advanced_telemetry: BASIC

  ENTERPRISE:
    description: 고위험, 규제, 대규모 병렬개발에서 추가 Guard와 복구 계약을 사용한다.
    human_artifacts:
      worklist: MUST
      requirement_customer_view: MUST
      engineering_design: MUST
      impact_analysis: MUST
      process_analysis: CONDITIONAL
      program_spec: CONFIGURABLE_L1_L2
      implementation_result: MUST
      test_verification: MUST
      separate_6w: OPTIONAL
    internal_capabilities:
      canonical_trace: MUST
      stage_input_pack: MUST
      deterministic_validators: MUST
      source_analysis: CONDITIONAL_BROWNFIELD
      knowledge_promotion: MUST
      stale_propagation: MUST
      semantic_merge: MUST
      action_permission: MUST
      target_write_proof: MUST
      work_unit_recovery: MUST
      advanced_telemetry: MUST

selection_rules:
  prefer_lite_when_all:
    - blast_radius_low
    - no_security_critical_change
    - no_external_contract_change
    - no_parallel_write_same_program
  require_enterprise_candidate_when_any:
    - high_blast_radius
    - security_critical
    - regulated_audit_required
    - parallel_write_same_program
    - complex_recovery_required
  otherwise: STANDARD

invariants:
  - disabled_human_artifact_must_not_remove_canonical_entity_or_relation
  - internal_guard_count_must_not_force_equal_number_of_human_documents
  - profile_change_requires_impact_review_not_core_rewrite
  - customer_input_must_not_require_internal_only_artifact
  - every_enabled_logical_human_artifact_must_resolve_to_document_group
  - multiple_logical_artifacts_may_share_one_physical_document
  - customer_visible_document_must_not_expose_internal_only_state_by_default
