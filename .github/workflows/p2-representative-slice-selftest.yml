name: p2-representative-slice-selftest

on:
  push:
    branches:
      - 'SDLC_DESIGN_SESSION_SECOND/p2/representative-brownfield-slice-v1'
  pull_request:
    paths:
      - 'sdlc/**'
      - '.github/workflows/p2-representative-slice-selftest.yml'

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml
      - name: Compile P2 runtime
        run: |
          python -m py_compile \
            sdlc/scripts/intake_requirements_xlsx.py \
            sdlc/scripts/analyze_java_spring.py \
            sdlc/scripts/analyze_sql_database.py \
            sdlc/scripts/guard_revision_ownership.py \
            sdlc/scripts/orchestrate_generic_e2e_status.py \
            sdlc/scripts/build_command_context.py \
            sdlc/scripts/test_p2_representative_slice.py
      - name: Run P1 compatibility tests
        run: |
          python sdlc/scripts/test_p1_foundation.py
          python sdlc/scripts/test_p1_runtime.py
      - name: Run structural redesign regression
        run: python sdlc/scripts/test_structural_redesign.py
      - name: Run P2 representative slice tests
        run: python sdlc/scripts/test_p2_representative_slice.py
