name: P0 P1 Production Readiness

on:
  push:
    branches:
      - 'SDLC_DESIGN_SESSION_FIRST/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-behavior:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python syntax check
        run: |
          python -m py_compile \
            sdlc/scripts/runtime_config.py \
            sdlc/scripts/project_config.py \
            sdlc/scripts/runtime_config_v19.py \
            sdlc/scripts/change_execution_runtime.py \
            sdlc/scripts/tailoring_runtime.py \
            sdlc/scripts/tailored_work.py \
            sdlc/scripts/tailored_check.py \
            sdlc/scripts/rq_worklist.py \
            sdlc/scripts/rq_reference_registry.py \
            sdlc/scripts/intake_reference_draft.py \
            sdlc/scripts/intake_explainable.py \
            sdlc/scripts/bootstrap_project.py \
            sdlc/scripts/harness.py \
            sdlc/scripts/import_requirements.py \
            sdlc/scripts/intake_requirements.py \
            sdlc/scripts/process_runner.py \
            sdlc/scripts/run_work.py \
            sdlc/scripts/interactive_work.py \
            sdlc/scripts/run_change.py \
            sdlc/scripts/interactive_change.py \
            sdlc/scripts/run_check.py \
            sdlc/scripts/apply_canonical_delta.py \
            sdlc/scripts/customer_projection_runtime.py \
            sdlc/scripts/customer_view_safe.py \
            sdlc/scripts/projection_lifecycle_runtime.py \
            sdlc/scripts/validate_canonical_projection_invariant.py \
            sdlc/scripts/validate_human_facing_language.py \
            sdlc/scripts/extract_document_evidence.py \
            sdlc/scripts/normalize_external_evidence.py \
            sdlc/scripts/capture_customer_decision.py \
            sdlc/scripts/run_knowledge_promotion.py \
            sdlc/custom/project/adapters/impact/java_spring_enterprise.py
      - name: v1.10 change-level, HRIS and HITL regression
        run: |
          python -m unittest \
            tests.test_change_level_control_plane_v110 \
            tests.test_hris_hunel_custom_engineering_profile \
            tests.test_primary_set_interactive_write_scope_v110 \
            tests.test_hitl_block_edit_ux \
            tests.test_human_facing_language_v110 -v
      - name: Human-facing terminology validation
        run: python sdlc/scripts/validate_human_facing_language.py --root .
      - name: v1.10 projection separation regression
        run: |
          python -m unittest \
            tests.test_projection_separation_v110 \
            tests.test_canonical_projection_invariant_v19 \
            tests.test_projection_visibility_hygiene_v110 \
            tests.test_customer_view_safety_and_cli_guide_parity_v110 -v
      - name: v1.10 guide, config, RQ management and document encoding regression
        run: |
          python -m unittest \
            tests.test_guide_consistency_v110 \
            tests.test_rq_list_skill_and_current_guides_v110 \
            tests.test_project_config_reference_v110 \
            tests.test_project_rq_worklist_v110 \
            tests.test_pm_bulk_and_rq_reference_registry_v110 \
            tests.test_intake_reference_draft_v110 \
            tests.test_document_encoding_v110 \
            tests.test_process_runner_v110 -v
      - name: v1.9 tailoring, intake and contract consistency regression
        run: |
          python -m unittest \
            tests.test_tailoring_control_plane_v19 \
            tests.test_requirement_extraction_manifest \
            tests.test_v19_config_template_projection_consistency -v
      - name: Integrated project config and intake behavioral regression
        run: |
          python -m unittest \
            tests.test_project_entry_config \
            tests.test_agent_neutral_execution \
            tests.test_agent_core_reference_parity \
            tests.test_requirement_intake_runtime \
            tests.test_p0_p1_production_readiness -v
      - name: Existing core runtime regressions
        run: |
          python -m unittest \
            tests.test_canonical_delta \
            tests.test_agent_stage_result \
            tests.test_agent_runtime_wiring \
            tests.test_p0_runtime_hardening \
            tests.test_program_spec_readiness \
            tests.test_harness_structure \
            tests.test_document_experience \
            tests.test_starter_kit_contract \
            tests.test_v16_complexity_reduction -v
      - name: Harness structure
        run: python sdlc/scripts/validate_harness_structure.py .
      - name: Document experience
        run: python sdlc/scripts/validate_document_experience.py .
