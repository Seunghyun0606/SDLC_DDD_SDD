name: P2 Integrated Scale-out Self-Test

on:
  push:
    branches:
      - 'SDLC_DESIGN_SESSION_SECOND/p2/**'
    paths:
      - 'sdlc/**'
      - '.github/workflows/p2-integrated-scaleout-selftest.yml'
  pull_request:
    paths:
      - 'sdlc/**'
      - '.github/workflows/p2-integrated-scaleout-selftest.yml'

jobs:
  p2-integrated-scaleout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pyyaml openpyxl
      - name: Compile P2 runtime
        run: |
          python -m py_compile \
            sdlc/scripts/analyze_batch_scheduler.py \
            sdlc/scripts/register_requirement_worklist.py \
            sdlc/scripts/assess_scaleout_readiness.py \
            sdlc/scripts/test_p2_integrated_scaleout.py
      - name: Run P2 integrated scale-out self-test
        run: python sdlc/scripts/test_p2_integrated_scaleout.py
      - name: Run P2 representative slice regression
        run: python sdlc/scripts/test_p2_representative_slice.py
      - name: Run P1 usability regression
        run: |
          python sdlc/scripts/test_p1_usability_authority.py
          python sdlc/scripts/test_p1_operational_usability.py
      - name: Run structural regression
        run: python sdlc/scripts/test_structural_redesign.py
      - name: Run P0 production-readiness regression
        run: python sdlc/scripts/test_p0_production_readiness.py
