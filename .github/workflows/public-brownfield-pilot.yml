name: Public Brownfield Pilot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mall-order-slice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Harness
        uses: actions/checkout@v4
        with:
          path: harness
      - name: Checkout pinned real Spring MyBatis repository
        uses: actions/checkout@v4
        with:
          repository: macrozheng/mall
          ref: 0504e86b1f1b6f1b8aa6a734d37a90fb67346be7
          path: external/mall
      - name: Run real repository impact pilot
        run: |
          python harness/sdlc/scripts/validate_public_brownfield_pilot.py \
            --source-root external/mall/mall-admin \
            --repository macrozheng/mall \
            --commit 0504e86b1f1b6f1b8aa6a734d37a90fb67346be7 \
            --output harness/sdlc/validation/results/public-brownfield-mall.json
      - name: Show pilot result
        if: always()
        run: |
          if [ -f harness/sdlc/validation/results/public-brownfield-mall.json ]; then
            cat harness/sdlc/validation/results/public-brownfield-mall.json
          fi
