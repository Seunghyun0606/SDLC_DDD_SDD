name: P0 Runtime Core Validation

on:
  push:
    branches:
      - 'SDLC_DESIGN_SESSION_SECOND/p0.redesign/runtime-core-v1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-runtime-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate P0 runtime exit gate
        run: python sdlc/scripts/validate_p0_runtime_core.py exit sdlc/config/p0-runtime-core-exit.yaml

      - name: Run redesigned P0 runtime conformance
        run: python sdlc/design/validation/p0-runtime-core-redesign-v1/test_runtime_core.py

      - name: Run legacy P0 regression suite
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in sdlc/scripts/test_p0*.py; do
            if [[ -f "$test_file" ]]; then
              echo "==> $test_file"
              python "$test_file"
              count=$((count + 1))
            fi
          done
          if [[ "$count" -eq 0 ]]; then
            echo "No legacy P0 tests found" >&2
            exit 1
          fi
          echo "Executed $count legacy P0 regression scripts"
